name: Android 构建 APK

on:
  push:
    branches: [main]
    paths:
      - 'gh-android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'gh-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gh-android
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 安装 Android SDK 平台 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 设置 Gradle 可执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: gh-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
